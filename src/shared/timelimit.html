<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a10;color:#c8d8e8;font-family:'Share Tech Mono',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;}
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
.box{background:#0c1219;border:1px solid rgba(255,140,0,0.4);border-radius:12px;padding:40px;text-align:center;width:380px;box-shadow:0 0 40px rgba(255,140,0,0.1);}
.icon{font-size:52px;margin-bottom:16px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.title{font-size:18px;color:#ff8c00;letter-spacing:3px;margin-bottom:8px;}
.site{font-size:14px;color:#c8d8e8;margin-bottom:6px;}
.msg{font-size:12px;color:#4a6080;margin-bottom:24px;line-height:1.6;}
.btn{width:100%;padding:12px;border-radius:6px;font-family:monospace;font-size:13px;cursor:pointer;letter-spacing:1px;margin-bottom:8px;transition:all 0.2s;}
.btn-go{background:rgba(255,140,0,0.15);border:1px solid rgba(255,140,0,0.5);color:#ff8c00;}
.btn-go:hover{background:rgba(255,140,0,0.3);}
.btn-back{background:none;border:1px solid #1a2535;color:#4a6080;}
.btn-back:hover{color:#00d4ff;border-color:#00d4ff;}
.bar-wrap{background:#0a0d14;border-radius:4px;height:6px;margin:16px 0;overflow:hidden;}
.bar{height:6px;background:linear-gradient(90deg,#ff8c00,#ff3860);border-radius:4px;width:100%;}
</style></head><body>
<div class="box">
  <div class="icon">⏰</div>
  <div class="title">TIME LIMIT REACHED</div>
  <div class="site" id="siteName">site.com</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="msg">You have reached today's time limit for this site.<br>Come back tomorrow. 🎯</div>
  <button class="btn btn-go" id="overrideBtn">🔓 Override Limit (5 min extra)</button>
  <button class="btn btn-back">← Go Back</button>
</div>
<script src="timelimit.js"></script></body></html>
