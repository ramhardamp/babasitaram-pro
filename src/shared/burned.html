<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BURNED</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    cursor: default;
  }

  /* Fire canvas behind */
  #fireCanvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    animation: fadeIn 1s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fire-emoji {
    font-size: 100px;
    display: block;
    animation: bounce 1s infinite alternate ease-in-out;
    filter: drop-shadow(0 0 30px #ff4400);
  }
  @keyframes bounce {
    from { transform: scale(1) rotate(-5deg); }
    to { transform: scale(1.1) rotate(5deg); }
  }

  h1 {
    font-size: 72px;
    color: #ff3300;
    letter-spacing: 12px;
    text-shadow: 0 0 30px #ff4400, 0 0 60px #ff2200, 0 0 100px #ff0000;
    animation: flicker 0.15s infinite alternate;
    margin: 20px 0 10px;
  }
  @keyframes flicker {
    from { opacity: 1; text-shadow: 0 0 30px #ff4400, 0 0 60px #ff2200; }
    to { opacity: 0.92; text-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300; }
  }

  .sub {
    color: #ff6600;
    font-size: 18px;
    letter-spacing: 4px;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeIn 1s ease 0.6s forwards;
  }

  .status-box {
    background: rgba(255, 30, 0, 0.08);
    border: 1px solid rgba(255, 60, 0, 0.3);
    border-radius: 8px;
    padding: 20px 40px;
    opacity: 0;
    animation: fadeIn 1s ease 1s forwards;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,60,0,0.15);
    color: #ff9966;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .status-item:last-child { border-bottom: none; }
  .status-item .icon { font-size: 18px; }
  .status-item .check {
    margin-left: auto;
    color: #ff4400;
    animation: checkPop 0.3s ease forwards;
  }
  @keyframes checkPop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  .timestamp {
    margin-top: 30px;
    color: rgba(255,100,0,0.5);
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeIn 1s ease 1.8s forwards;
  }

  /* Particle sparks */
  .spark {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    z-index: 5;
    animation: sparkFly linear forwards;
  }
  @keyframes sparkFly {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
  }
</style>
</head>
<body>

<canvas id="fireCanvas"></canvas>

<div class="content">
  <span class="fire-emoji">🔥</span>
  <h1>BURNED</h1>
  <div class="sub">EMERGENCY PROTOCOL EXECUTED</div>

  <div class="status-box">
    <div class="status-item" style="animation-delay:1.2s">
      <span class="icon">🗑️</span> History Wiped
      <span class="check">✓</span>
    </div>
    <div class="status-item" style="animation-delay:1.4s">
      <span class="icon">🍪</span> Cookies Destroyed
      <span class="check">✓</span>
    </div>
    <div class="status-item" style="animation-delay:1.6s">
      <span class="icon">💾</span> Cache Cleared
      <span class="check">✓</span>
    </div>
    <div class="status-item" style="animation-delay:1.8s">
      <span class="icon">📦</span> Local Storage Purged
      <span class="check">✓</span>
    </div>
    <div class="status-item" style="animation-delay:2s">
      <span class="icon">🚪</span> All Tabs Closed
      <span class="check">✓</span>
    </div>
  </div>

  <div class="timestamp" id="ts"></div>
</div>

<script src="burned.js"></script>
</body>
</html>
